  <text class="label" x="249" y="590"><tspan x="249">Spell Matching</tspan><tspan x="249" dy="13">Name Data</tspan></text>
  <text class="label" x="374" y="590"><tspan x="374">Spell Information</tspan><tspan x="374" dy="13">Stored in QR</tspan></text>
